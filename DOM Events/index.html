<!-- DOM Events -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Events</title>
  </head>
  <body>
    <h1>DOM Events</h1>
    <!-- Add an input field to the HTML -->
    <input type="text" id="myInput" placeholder="Add an item to the list" />
    <!-- Add a button to the HTML -->
    <button class="button" id="enter">Enter</button>
    <button class="delbutton" id="delete">Delete</button>
    <ul id="myList">
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
    </ul>
    <!-- Add a script tag to the HTML to link to the JavaScript file -->
    <script src="script.js"></script>
  </body>
</html>
