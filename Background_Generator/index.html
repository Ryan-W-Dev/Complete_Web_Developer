<!-- Background Generator -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Background Generator</title>
  </head>
  <body id="gradient">
    <h1>Background Generator</h1>
    <!-- This is a simple background generator that allows you to select two colors and generates a linear gradient background. -->
    <input type="color" id="color1" class="color1" name="color1" value="#ff0000" />
    <input type="color" id="color2" class="color2" name="color2" value="#ffff00" />
    <h2>Current CSS Background</h2>
    <script src="script.js"></script>
  </body>
</html>
